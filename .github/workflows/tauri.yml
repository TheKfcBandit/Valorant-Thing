name: Tauri Build & Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Static checks. Gating: prettier, eslint, rustfmt, cargo test.
  # Advisory (continue-on-error): cargo clippy, which still reports 2
  # pre-existing warnings in src/riot/process.rs that need their own
  # focused fix before clippy can gate.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install Linux deps for cargo check
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: install frontend deps
        run: npm ci
      - name: prettier --check
        run: npm run format:check
      - name: eslint
        run: npm run lint
      - name: rustfmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-deps -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 1. Install Linux dependencies (Only needed for Ubuntu)
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 2. Setup Node.js (for the frontend)
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Setup Rust
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 4. Cache Rust dependencies to speed up future builds
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 5. Cache Tauri's NSIS bundler download (Windows). Avoids re-downloading
      # nsis-3.11.zip from tauri-apps/binary-releases on every run — that
      # release-asset endpoint has hit transient 504s in CI.
      - name: cache tauri NSIS bundler
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\tauri\NSIS
            ~\AppData\Roaming\tauri\NSIS
          key: tauri-nsis-3.11-${{ runner.os }}

      # 6. Install Frontend dependencies — npm ci is deterministic from the
      # lockfile and fails loudly on drift, unlike `npm install` which silently
      # rewrites package-lock.json.
      - name: install frontend dependencies
        run: npm ci

      # 7. Build the app using the Tauri Action
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use 'args: --debug' if you just want to test without a full release build
          args: ""
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Valorant Thing {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      - name: upload Windows installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ValorantThing-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
